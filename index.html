    print(ps.textContent+line);
    const l=line.trim();
    if(pending){const go=pending;pending=null;return l.toLowerCase()=='yes'?go():print('hardset cancelled.')}
    if(repl)return replLine(line);
    if(!l)return;
    hist.push(l);hi=hist.length;
    const m=l.match(/^echo\s+(.*?)\s*>\s*(\S+)$/);
    if(m){let f=find(m[2]);if(!f){f=create('file',here());f.name=m[2]}
      if(f.type!='file')return print('echo: '+m[2]+': not a text file');
      if(f.sys)return print('echo: '+m[2]+' '+PROTECTED);
      f.content=m[1]+'\n';save();render();return}
    const [cmd,...a]=l.split(/\s+/);
    if(cmd=='echo')return print(a.join(' '));
    const fn=C[cmd.toLowerCase()];
    return fn?fn(a.join(' ')):print(cmd+': command not found (try help)');
  };
  const submit=v=>{
    const r=run(v);
    if(r&&typeof r.then=='function'){inp.disabled=true;return r.catch(()=>{}).finally(()=>{inp.disabled=false;if(w.isConnected){prompt();inp.focus()}})}
    if(w.isConnected)prompt();return Promise.resolve();
  };
  inp.addEventListener('paste',e=>{
    const txt=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\r\n?/g,'\n').replace(/\n+$/,'');
    if(!txt.includes('\n'))return;
    e.preventDefault();
    if(repl&&!repl.cont){
      /* a pasted block of code runs as a whole script, like a .py file */
      txt.split('\n').forEach((l,i)=>print((i?'... ':'>>> ')+l));
      try{repl.arm(PY_LIMIT);repl.run(txt+'\n','<console>','exec')}
      catch(er){print(String(er&&er.message||er).trim().split('\n').slice(-4).join('\n'),'err')}
      prompt();return;
    }
    (async()=>{for(const l of txt.split('\n'))await submit(l);if(repl&&repl.cont)await submit('')})();
  });
  inp.addEventListener('keydown',e=>{
    if(e.key=='Enter'){const v=inp.value;inp.value='';submit(v)}
    else if(e.key=='ArrowUp'){if(hi>0)inp.value=hist[--hi];e.preventDefault()}
    else if(e.key=='ArrowDown'){inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'');e.preventDefault()}
    else if(e.key=='l'&&e.ctrlKey){out.innerHTML='';e.preventDefault()}
  });
  b.addEventListener('pointerup',()=>{if(!getSelection().toString())inp.focus()});
  if(o.script!==undefined){
    print('[lxo] running '+o.label+'\n');prompt();
    for(const l of o.script.split('\n').map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'))){
      if(!w.isConnected)break;run(l);if(w.isConnected)prompt();
    }
    print('[lxo] finished.');
  }else{print(KOALA+'\nType "help" for commands.\n');prompt()}
  inp.focus();
}

/* ---------- default apps: every app is a protected .lxo ---------- */
function ensureSystem(){
  let f=S.items.find(i=>i.sys&&i.type=='folder'&&i.name=='Programs');
  if(!f){f={id:S.next++,type:'folder',parent:null,name:'Programs',content:'',sys:true};S.items.push(f)}
  f.home=true;delete f.x;delete f.y;
  PROGRAMS.forEach(p=>{
    const nm=p.name+'.lxo';
    if(!S.items.some(i=>i.sys&&i.parent==f.id&&i.name==nm))
      S.items.push({id:S.next++,type:'file',parent:f.id,name:nm,sys:true,content:'# '+p.name+' - default koalOS app (protected)\nrun '+p.name.toLowerCase()+'\n'});
  });
  save();
}

/* ---------- boot screen ---------- */
function boot(){
  const el=$('#boot');if(!el)return;
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const dots=(s,n=46)=>s+' '+'.'.repeat(Math.max(2,n-s.length))+' [ OK ]';
  const top=kids(null),L=[...KOALA.split('\n'),'','koalOS BIOS v1.0  (c) 2026 Koala Systems',
    dots('CPU: KoalaCore x8 @ 3.2GHz'),dots('Memory test: 16384 KB'),dots('Detecting display'),'',
    'Booting koalOS kernel...',dots('Mounting /dev/desktop'),'Loading folders...'];
  top.slice(0,10).forEach(i=>{
    const n=i.type=='folder'?kids(i.id).length+' items':(i.content||'').length+' bytes';
    L.push(dots('  ['+(i.type=='folder'?'DIR ':(i.type=='pice'||i.type=='image')?'IMG ':i.type=='shortcut'?'LNK ':/\.lxo$/i.test(i.name)?'EXE ':'FILE')+'] ~/'+i.name+' ('+n+')'));
  });
  if(top.length>10)L.push('  ... and '+(top.length-10)+' more');
  L.push(dots('Restoring window layout'),dots('Starting taskbar service'),dots('Loading programs: '+PROGRAMS.map(p=>p.name.toLowerCase()).join(' '),60),'','Welcome to koalOS. Press any key to skip.');
  L.splice(L.length-1,1,'Welcome to koalOS.');
  const cur=document.createElement('span');cur.className='bc';cur.textContent='█';
  const pre=document.createElement('pre');pre.appendChild(cur);el.appendChild(pre);
  let i=0,done=false;
  const end=()=>{if(done)return;done=true;el.classList.add('off');setTimeout(()=>el.remove(),700)};
  el.addEventListener('pointerdown',end);addEventListener('keydown',end,{once:true});
  const step=()=>{
    if(done)return;
    if(i>=L.length)return void setTimeout(end,700);
    cur.insertAdjacentHTML('beforebegin',esc(L[i++]).replace('[ OK ]','<span class="ok">[ OK ]</span>')+'\n');
    setTimeout(step,25+Math.random()*95);
  };
  step();
}

/* ---------- icon dragging / dropping ---------- */
let sel=null;
function select(id){sel=id;document.querySelectorAll('.icon').forEach(e=>e.classList.toggle('sel',e.dataset.id==id))}
function iconDown(e,id,el){
  if(e.button)return;e.stopPropagation();select(id);
  const sx=e.clientX,sy=e.clientY;let ghost=null,hot=null;
  const mv=ev=>{
    if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      ghost=el.cloneNode(true);ghost.className='icon ghost';ghost.style.left=ghost.style.top='';document.body.appendChild(ghost);el.style.opacity=.35}
    ghost.style.left=ev.clientX-42+'px';ghost.style.top=ev.clientY-30+'px';
    const t=target(ev,ghost);hot&&hot.classList.remove('drop');
    hot=t.kind=='icon'?t.el:null;hot&&hot.classList.add('drop');
  };
  const up=ev=>{
    removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
    hot&&hot.classList.remove('drop');
    if(!ghost)return;
    const t=target(ev,ghost);ghost.remove();el.style.opacity=1;
    if(t.kind=='icon')move(id,+t.el.dataset.id);
    else if(t.kind=='win')move(id,t.el.dataset.id?+t.el.dataset.id:null,{x:0,y:0});
    else if(t.kind=='desktop')move(id,null,{x:ev.clientX-42,y:ev.clientY-30});
  };
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
function target(ev,ghost){
  ghost.style.display='none';
  const els=document.elementsFromPoint(ev.clientX,ev.clientY);ghost.style.display='';
  const ic=els.find(e=>e.classList?.contains('icon')&&e.dataset.type=='folder');
  if(ic)return{kind:'icon',el:ic};
  const w=els.find(e=>e.classList?.contains('win'));
  if(w)return w.dataset.kind=='folder'?{kind:'win',el:w}:{kind:'none'};
  if(els.includes($('#desktop')))return{kind:'desktop'};
  return{kind:'none'};
}

/* ---------- menus ---------- */
const menu=$('#menu');
function showMenu(e,entries){
  menu.innerHTML='';
  entries.forEach(en=>{if(en=='-'){menu.appendChild(document.createElement('hr'));return}
    const d=document.createElement('div');d.textContent=en[0];d.onclick=()=>{hideMenu();en[1]()};menu.appendChild(d)});
  menu.style.display='block';
  menu.style.left=Math.min(e.clientX,innerWidth-menu.offsetWidth-4)+'px';
  menu.style.top=Math.min(e.clientY,innerHeight-menu.offsetHeight-4)+'px';
}
const hideMenu=()=>menu.style.display='none';
function bgMenu(e,parent){
  const r=$('#desktop').getBoundingClientRect();
  const pos={x:e.clientX-r.left-42,y:e.clientY-r.top-30};
  showMenu(e,[['New folder',()=>{const i=create('folder',parent,pos);rename(i.id)}],['New text file',()=>{const i=create('file',parent,pos);rename(i.id)}],['Import image\u2026',()=>pickImages(parent,pos)],'-',
    ['Open Files',()=>openFolder(null)],['Open Paint',()=>openPaint()],...(S.wallpaper?[['Reset wallpaper',()=>setWall(null)]]:[]),['Settings',openSettings]]);
}
function itemMenu(e,id){
  select(id);
  if(item(id).sys)return showMenu(e,[['Open',()=>open(id)],...(/\.lxo$/i.test(item(id).name)?[['View source',()=>openFile(id)]]:[]),'-',['Default app — protected',()=>{}]]);
  showMenu(e,[['Open',()=>open(id)],['Rename',()=>rename(id)],...(/\.lxo$/i.test(item(id).name)?[['Edit',()=>openFile(id)]]:[]),...((item(id).type=='pice'||item(id).type=='image')?[['Set as wallpaper',()=>setWall(id)]]:[]),...(item(id).parent!=null?[['Move to desktop',()=>move(id,null)]]:[]),'-',['Delete',()=>del(id)]]);
}
function rename(id){
  if(item(id)?.sys)return toast('Protected','"'+item(id).name+'" '+PROTECTED);
  setTimeout(()=>{
    const el=document.querySelector(`.icon[data-id="${id}"]`);if(!el)return;
    const n=el.querySelector('.n'),inp=document.createElement('input');inp.value=item(id).name;inp.style.userSelect='text';
    n.replaceWith(inp);inp.focus();inp.setSelectionRange(0,item(id).type=='file'?inp.value.lastIndexOf('.'):inp.value.length);
    let done=false;
    const fin=ok=>{if(done)return;done=true;if(ok&&inp.value.trim())item(id).name=inp.value.trim();save();render()};
    inp.onkeydown=ev=>{ev.stopPropagation();if(ev.key=='Enter')fin(true);if(ev.key=='Escape')fin(false)};
    inp.onblur=()=>fin(true);inp.ondblclick=inp.onpointerdown=ev=>ev.stopPropagation();
  },0);
}
$('#desktop').addEventListener('contextmenu',e=>{e.preventDefault();if(e.target.id=='desktop')bgMenu(e,null)});
$('#desktop').addEventListener('pointerdown',e=>{if(e.target.id=='desktop')select(null)});
addEventListener('pointerdown',e=>{if(!menu.contains(e.target))hideMenu();if(!e.target.closest('#results,#search,#start'))closeResults()});
addEventListener('keydown',e=>{
  if(e.target.tagName=='INPUT'||e.target.tagName=='TEXTAREA')return;
  if(e.key=='Delete'&&sel)del(sel);
  if(e.key=='F2'&&sel)rename(sel);
});

/* ---------- search ---------- */
const sIn=$('#search'),R=$('#results');let ri=0,rl=[];
function results(){
  const q=sIn.value.trim().toLowerCase();
  const progs=PROGRAMS.filter(p=>p.name.toLowerCase().includes(q));
  const isExe=i=>i.type!='folder'&&i.type!='shortcut'&&/\.lxo$/i.test(i.name);
  const exes=S.items.filter(i=>isExe(i)&&!i.sys&&i.name.toLowerCase().includes(q));
  const files=q?S.items.filter(i=>i.name.toLowerCase().includes(q)&&!isExe(i)):[];
  rl=[...progs.map(p=>({g:p.glyph,n:p.name,s:'Program',go:p.run})),...exes.map(i=>({g:'lxo',n:i.name.replace(/\.lxo$/i,''),s:'Program',go:()=>open(i.id)})),...files.map(i=>({g:iconKey(i),n:i.name,s:i.type=='folder'?'Folder':'File',go:()=>open(i.id)}))];
  R.innerHTML='';
  let last='';
  rl.forEach((r,i)=>{if(r.s!=last&&(r.s=='Program')!=(last=='Program')){const h=document.createElement('div');h.className='h';h.textContent=r.s=='Program'?'Programs':'Files & folders';R.appendChild(h)}last=r.s;
    const d=document.createElement('div');d.className='res'+(i==ri?' on':'');d.innerHTML=`<span class="ri">${icon(r.g)}</span><span></span><small>${r.s}</small>`;d.children[1].textContent=r.n;
    d.onclick=()=>{r.go();closeResults();sIn.value=''};R.appendChild(d)});
  if(!rl.length)R.innerHTML='<div class="empty">No results</div>';
  R.style.display='block';
}
function closeResults(){R.style.display='none'}
sIn.addEventListener('input',()=>{ri=0;results()});
sIn.addEventListener('focus',()=>{ri=0;results()});
sIn.addEventListener('keydown',e=>{
  if(e.key=='ArrowDown'){ri=Math.min(rl.length-1,ri+1);results();e.preventDefault()}
  else if(e.key=='ArrowUp'){ri=Math.max(0,ri-1);results();e.preventDefault()}
  else if(e.key=='Enter'&&rl[ri]){rl[ri].go();closeResults();sIn.value='';sIn.blur()}
  else if(e.key=='Escape'){closeResults();sIn.blur()}
});
$('#start').onclick=()=>{R.style.display=='block'?closeResults():(sIn.focus())};

/* ---------- clock & boot ---------- */
function tick(){const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString([],{month:'short',day:'numeric'})}
tick();setInterval(tick,10000);
if(!S.items.length){
  S.items.push({id:S.next++,type:'folder',parent:null,name:'Documents',content:'',x:10,y:10},
    {id:S.next++,type:'file',parent:null,name:'Welcome.txt',x:10,y:110,content:'Welcome to koalOS!\n\n• Right-click the desktop to create folders and text files\n• Drag icons around, or drop them onto folders\n• Double-click to open\n• Search programs in the bottom bar\n• Everything saves automatically.\n• Type "pluck" in the Terminal to put a shortcut for every .lxo program on the desktop.'},
    {id:S.next++,type:'file',parent:null,name:'hello.lxo',x:10,y:210,content:'# hello.lxo - a koalOS program (one terminal command per line)\nbigtxt hello star\nrun calc\n'});
  save();
}
ensureSystem();
render();
boot();
bdInit();
</script>
